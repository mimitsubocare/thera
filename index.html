*{box-sizing:border-box}
body{margin:0;background:#f7cfd3;color:#382d2b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:540px;margin:auto;padding:16px}
.card{background:#fffdfd;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 7px 20px #8b53651a}
.logo{width:92px;height:92px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 8px}
h1{font-size:28px;color:#7e3049;text-align:center;margin:4px 0}
.sub{text-align:center;color:#8b6874;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.recipeBtn{border:0;border-radius:16px;padding:13px 8px;background:#fff;border:1.5px solid #edcbd6;color:#653848;font-size:15px;font-weight:800;box-shadow:0 3px 8px #0000000a}
.recipeBtn:active{transform:scale(.98)}
#detail{display:none}
.recipeNav{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:7px;margin-bottom:10px}
.recipeNav button{border:0;background:#eee4e7;color:#604b52;border-radius:14px;padding:10px 6px;font-weight:800;font-size:12px;white-space:nowrap}
.recipeNav button:disabled{opacity:.35}
.recipeChara{width:110px;height:110px;object-fit:contain;display:block;margin:10px auto 0}
.title{font-size:27px;font-weight:900;color:#7e3049;margin:8px 0 4px;text-align:center}
.ear{position:relative;width:min(88vw,390px);margin:12px auto}
.ear img{display:block;width:100%;border-radius:18px}
.dot{position:absolute;width:25px!important;height:25px!important;min-width:25px;min-height:25px;aspect-ratio:1/1;border-radius:50%!important;transform:translate(-50%,-50%);border:3px solid white;box-shadow:0 2px 8px #0006;display:block;flex:none}
.dot.front{background:#e55e91}
.dot.back{background:#8060ad;padding:0!important}
.dot.stim{background:#4daaaa}
.dot.white{background:#fff;border-color:#d9d2d4}
.row{padding:13px 14px;border:1.5px solid #efd7df;border-radius:16px;margin:9px 0;background:#fff}
.row b{font-size:18px;color:#79374d}
.effect{margin-top:5px;line-height:1.55;color:#5d5154}
.note{font-size:12px;line-height:1.55;color:#7d6d72;background:#fff6f8;border-radius:13px;padding:11px;margin-top:14px}
.empty{text-align:center;padding:18px;color:#876d76}

/* entrance lock */
#lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lockCard{width:min(100%,430px);background:#fffdfd;border-radius:28px;padding:28px 22px;box-shadow:0 10px 30px #8b53652b;text-align:center}
.lockLogo{width:105px;height:105px;object-fit:contain;border-radius:50%;margin:0 auto 10px;display:block}
.lockTitle{font-size:27px;font-weight:900;color:#7e3049;margin:5px 0 7px}
.lockText{font-size:14px;color:#8b6874;line-height:1.7;margin-bottom:18px}
#passwordInput{width:100%;border:2px solid #efd3dc;background:#fff;border-radius:16px;padding:14px;font-size:20px;text-align:center;letter-spacing:4px;outline:none}
#passwordInput:focus{border-color:#d68ba3}
#unlockBtn{width:100%;border:0;border-radius:16px;padding:14px;margin-top:11px;background:#7e3049;color:#fff;font-size:16px;font-weight:900}
#unlockBtn:active{transform:scale(.98)}
#lockError{min-height:24px;margin-top:10px;color:#b33c61;font-size:14px;font-weight:800}
#app{display:none}

function showApp(){
  document.getElementById("lockScreen").style.display="none";
  document.getElementById("app").style.display="block";
}

function unlockApp(){
  const input=document.getElementById("passwordInput");
  const error=document.getElementById("lockError");

  if(input.value===APP_PASSWORD){
    try{localStorage.setItem(ACCESS_KEY,"ok")}catch(e){}
    error.textContent="";
    showApp();
    window.scrollTo(0,0);
  }else{
    error.textContent="ちゃうで🤣 もう一回。";
    input.value="";
    input.focus();
  }
}

document.getElementById("unlockBtn").addEventListener("click",unlockApp);
document.getElementById("passwordInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") unlockApp();
});

try{
  if(localStorage.getItem(ACCESS_KEY)==="ok") showApp();

const charaImages=["mcs_start.PNG","mcs_study.PNG","mcs_correct.PNG"];

const aliases={
  "肝（右）":"肝",
  "脾（左）":"脾",
  "内分泌（刺激のみ）":"内分泌",
  "内鼻（裏）":"内鼻",
  "大脳皮質下（裏）":"大脳皮質下",
  "耳迷根（裏）":"耳迷根",
  "腕（表）":"腕",
  "腕（裏）":"腕"
};

let currentRecipeIndex=-1;

function updateRecipeNav(){
  const prev=document.getElementById("prevBtn");
  const next=document.getElementById("nextBtn");
  if(!prev||!next)return;
  prev.disabled=currentRecipeIndex<=0;
  next.disabled=currentRecipeIndex<0||currentRecipeIndex>=recipes.length-1;
}

function renderList(q=""){
  const g=document.getElementById("grid");
  g.innerHTML="";

  const a=recipes.filter(r=>
    (r.n+" "+r.t+" "+r.p.flat().join(" ")).toLowerCase().includes(q.toLowerCase())
  );

  if(!a.length){
    g.innerHTML='<div class="empty" style="grid-column:1/-1">見つからへんかった🤣</div>';
    return;
  }

  a.forEach(r=>{
    let b=document.createElement("button");
    b.className="recipeBtn";
    b.innerHTML=`<small>レシピ${r.n}</small><br>${r.t}`;
    b.onclick=()=>openRecipe(r);
    g.appendChild(b);
  });
}

function pointName(name){
  return aliases[name]||name;
}

function openRecipe(r){
  currentRecipeIndex=recipes.findIndex(x=>x.n===r.n);
  updateRecipeNav();

  const menuEl=document.getElementById("menu");
  const detailEl=document.getElementById("detail");
  const recipeTitleEl=document.getElementById("recipeTitle");
  const dotsEl=document.getElementById("dots");
  const rowsEl=document.getElementById("rows");
  const earImgEl=document.getElementById("earImg");
  const recipeCharaEl=document.getElementById("recipeChara");
  const hiddenEarWrapEl=document.getElementById("hiddenEarWrap");
  const hiddenDotsEl=document.getElementById("hiddenDots");

  hiddenEarWrapEl.style.display="none";
  hiddenDotsEl.innerHTML="";
  menuEl.style.display="none";
  detailEl.style.display="block";

  recipeCharaEl.src=
    charaImages[Math.floor(Math.random()*charaImages.length)]+"?v=20261005-1";

  recipeTitleEl.textContent=`レシピ${r.n}：${r.t}`;
  dotsEl.innerHTML="";
  rowsEl.innerHTML="";
  earImgEl.src="ear_base.PNG?v=20261005-1";

  r.p.forEach((x,idx)=>{
    let name=x[0];
    let base=pointName(name);
    let mode=x[2]||"front";
    let custom=x[3]||null;
    let isBack=mode==="back"||name.includes("（裏）");
    let pos=custom||(!isBack?F[base]:null);

    if(pos){
      let d=document.createElement("span");

      d.className="dot "+(
        base==="大脳皮質下"
          ?"back"
          :(mode==="stim"
            ?"stim"
            :(x[4]==="white"
              ?"white"
              :(isBack?"back":"front")))
      );

      d.style.left=pos[0]+"%";
      d.style.top=pos[1]+"%";
      d.title=name;

      if(x[5]){
        hiddenEarWrapEl.style.display="block";
        document.getElementById("hiddenEarImg").src=x[5]+"?v=20261005-1";
        hiddenDotsEl.appendChild(d);
      }else{
        dotsEl.appendChild(d);
      }
    }

    let rr=document.createElement("div");
    rr.className="row";
    rr.innerHTML=`<b>${idx+1}. ${name}</b><div class="effect">${x[1]}</div>`;
    rowsEl.appendChild(rr);
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("backBtn").onclick=()=>{
  document.getElementById("detail").style.display="none";
  document.getElementById("menu").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
};

document.getElementById("prevBtn").onclick=()=>{
  if(currentRecipeIndex>0){
    openRecipe(recipes[currentRecipeIndex-1]);
  }
};

document.getElementById("nextBtn").onclick=()=>{
  if(currentRecipeIndex>=0&&currentRecipeIndex<recipes.length-1){
    openRecipe(recipes[currentRecipeIndex+1]);
  }
};

renderList();
